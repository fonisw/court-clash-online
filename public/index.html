
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COURT CLASH</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09111f;color:#f4f7ff;font-family:Arial,sans-serif}
main{max-width:1000px;margin:auto;padding:20px}
h1{color:#ff914d}
.panel{background:#141f32;border:1px solid #30405a;border-radius:14px;padding:18px;margin:15px 0}
input,select,button{font:inherit;padding:11px;border-radius:8px;margin:4px}
input,select{background:#091525;color:white;border:1px solid #41536e;max-width:100%}
button{background:#ff914d;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#30405a;color:white}
#status{color:#8ed5ff}
#message{color:#9ee8b1;min-height:25px}
#court{display:block;width:100%;background:#b87943;border-radius:10px}
.score{font-size:22px;font-weight:bold}
.small{font-size:13px;color:#bdc9dc}
</style>
</head>
<body>
<main>
<h1>🏀 COURT CLASH</h1>
<p>ONLINE BASKETBALL</p>

<section class="panel">
<h2>온라인 멀티플레이</h2>
<p id="status">서버 연결 중...</p>
<p>경기 모드
<select id="mode">
<option value="1v1">1 VS 1</option>
<option value="2v2">2 VS 2</option>
</select></p>
<p>방 생성 비밀번호
<input id="password" type="password" placeholder="비밀번호 (선택)"></p>
<button id="create">온라인 방 만들기</button>
<hr>
<p>친구 방 코드
<input id="joinCode" maxlength="3" placeholder="ABC"></p>
<p>방 비밀번호
<input id="joinPassword" type="password" placeholder="비밀번호"></p>
<button id="join" class="secondary">친구 방 참가</button>
<p id="message">서버에 연결하는 중입니다.</p>
</section>

<section class="panel">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
<span class="score">YOU <span id="myScore">0</span></span>
<span id="gameState">경기 대기 중</span>
<span class="score">OPPONENT <span id="opScore">0</span></span>
</div>
<canvas id="court" width="900" height="520"></canvas>
<p><button id="start">경기 시작</button>
<button id="reset" class="secondary">위치 초기화</button></p>
<p class="small">WASD 또는 방향키: 이동 · SPACE: 점프 · R: 슛</p>
</section>
</main>

<script>
(() => {
const $=id=>document.getElementById(id);
const canvas=$('court'),ctx=canvas.getContext('2d');
const net=io();

let connected=false,inRoom=false,playing=false,isHost=false;
let roomCode='',opponent=null,lastSend=0,lastFrame=0;
let keys={},score=0,opponentScore=0,shotCooldown=0;

const player={x:.5,y:.78,jump:0,hasBall:true};

function say(t){$('message').textContent=t}
function status(t){$('status').textContent=t}
function randomCode(){
 const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 return Array.from({length:3},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}
function scores(){
 $('myScore').textContent=score;
 $('opScore').textContent=opponentScore;
}

net.on('connect',()=>{
 connected=true;status('서버 연결 완료');
 say('방을 만들거나 친구 방에 참가하세요.');
});
net.on('connect_error',()=>{
 connected=false;status('서버 연결 실패');
 say('서버 연결에 실패했습니다. 잠시 후 새로고침하세요.');
});
net.on('disconnect',()=>{
 connected=false;inRoom=false;playing=false;opponent=null;
 status('연결 끊김');say('서버 연결이 끊어졌습니다.');
});

$('create').onclick=()=>{
 if(!connected)return say('서버 연결을 기다려 주세요.');
 if(inRoom)return say('이미 방에 참가 중입니다.');
 roomCode=randomCode();isHost=true;
 net.emit('create-room',{
  code:roomCode,password:$('password').value,mode:$('mode').value
 },res=>{
  if(!res||!res.ok){roomCode='';return say(res?.message||'방 생성 실패');}
  inRoom=true;
  $('joinCode').value=res.code;
  status('방 코드 '+res.code);
  say('방 생성 성공! 친구에게 코드 '+res.code+'를 알려 주세요.');
 });
};

$('join').onclick=()=>{
 if(!connected)return say('서버 연결을 기다려 주세요.');
 if(inRoom)return say('이미 방에 참가 중입니다.');
 const code=$('joinCode').value.trim().toUpperCase();
 if(!/^[A-Z0-9]{3}$/.test(code))return say('방 코드는 3글자여야 합니다.');
 net.emit('join-room',{
  code,password:$('joinPassword').value
 },res=>{
  if(!res||!res.ok)return say(res?.message||'방 참가 실패');
  inRoom=true;isHost=false;roomCode=res.code;
  $('mode').value=res.mode||'1v1';
  status('방 코드 '+res.code);
  say('방 참가 성공! 방장이 경기 시작을 눌러 주세요.');
 });
};

net.on('room-update',d=>{
 if(d)status('방 '+d.code+' · '+d.players+'명 참가');
});

$('start').onclick=()=>{
 if(!inRoom)return say('먼저 온라인 방을 만들거나 참가하세요.');
 if(!isHost)return say('방장이 경기 시작을 눌러야 합니다.');
 net.emit('start-match');
};

net.on('match-start',()=>{
 playing=true;score=0;opponentScore=0;
 player.x=.5;player.y=.78;player.jump=0;player.hasBall=true;
 scores();$('gameState').textContent='경기 진행 중';
 say('경기 시작! 이동해서 슛을 시도하세요.');
});

net.on('peer-left',()=>{
 opponent=null;say('상대방 연결이 끊어졌습니다.');
});
net.on('peer-state',packet=>{
 if(!packet||!packet.state)return;
 opponent=packet.state;
 if(typeof opponent.score==='number'){
  opponentScore=opponent.score;scores();
 }
});

function sendState(now){
 if(inRoom&&connected&&playing&&now-lastSend>50){
  lastSend=now;
  net.emit('player-state',{
   x:(player.x-.5)*9,z:player.y*10,jump:player.jump,
   hasBall:player.hasBall,score,rivalScore:opponentScore,
   ball:{x:(player.x-.5)*9,z:player.y*10,y:player.jump,
    flight:0,loose:false,kind:'ball'},
   playing
  });
 }
 requestAnimationFrame(sendState);
}
requestAnimationFrame(sendState);

function move(dt){
 if(!playing)return;
 let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx--;
 if(keys.d||keys.arrowright)dx++;
 if(keys.w||keys.arrowup)dy--;
 if(keys.s||keys.arrowdown)dy++;
 const len=Math.hypot(dx,dy)||1,speed=.42*dt;
 player.x=Math.max(.06,Math.min(.94,player.x+dx/len*speed));
 player.y=Math.max(.12,Math.min(.91,player.y+dy/len*speed));
 player.jump=Math.max(0,player.jump-dt*2.5);
 shotCooldown=Math.max(0,shotCooldown-dt);
}

function shoot(){
 if(!playing||shotCooldown>0)return;
 shotCooldown=1;player.hasBall=false;
 const distance=Math.hypot(player.x-.5,player.y-.15);
 const chance=Math.max(.15,.8-distance*.65);
 if(Math.random()<chance){
  score+=distance<.25?2:3;say('슛 성공!');
 }else say('슛 실패!');
 scores();
 setTimeout(()=>{player.hasBall=true},500);
}

window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 keys[k===' '?'space':k]=true;
 if(k===' '&&playing&&player.jump===0)player.jump=1;
 if(k==='r'&&!e.repeat)shoot();
});
window.addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();keys[k===' '?'space':k]=false;
});
window.addEventListener('blur',()=>{keys={};});

$('reset').onclick=()=>{
 player.x=.5;player.y=.78;player.jump=0;
};

function drawPlayer(x,y,color,jump){
 const px=x*canvas.width,py=y*canvas.height-jump*22;
 ctx.fillStyle='rgba(0,0,0,.25)';
 ctx.beginPath();ctx.ellipse(px,y*canvas.height+13,22,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py-18,13,0,Math.PI*2);ctx.fill();
 ctx.fillRect(px-13,py-5,26,29);
 ctx.strokeStyle='#182233';ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(px-7,py+23);ctx.lineTo(px-10,py+38);
 ctx.moveTo(px+7,py+23);ctx.lineTo(px+10,py+38);ctx.stroke();
}

function draw(){
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#b87943';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#ffe0b2';ctx.lineWidth=4;
 ctx.strokeRect(24,24,w-48,h-48);
 ctx.beginPath();ctx.moveTo(w/2,24);ctx.lineTo(w/2,h-24);ctx.stroke();
 ctx.beginPath();ctx.arc(w/2,h/2,65,0,Math.PI*2);ctx.stroke();
 for(const x of [w*.12,w*.88]){
  ctx.strokeRect(x-35,h/2-55,70,110);
  ctx.beginPath();ctx.arc(x,h/2,23,0,Math.PI*2);ctx.stroke();
 }
 drawPlayer(player.x,player.y,'#ff633d',player.jump);
 if(opponent){
  const ox=Math.max(-4.5,Math.min(4.5,Number(opponent.x)||0));
  const oz=Math.max(.5,Math.min(10,Number(opponent.z)||5));
  drawPlayer(.5+ox/9,oz/10,'#43b8ff',Math.max(0,Number(opponent.jump)||0));
 }
 if(player.hasBall){
  const px=player.x*w+20,py=player.y*h-7-player.jump*22;
  ctx.fillStyle='#f58b24';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#60320d';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(px-8,py);ctx.lineTo(px+8,py);
  ctx.moveTo(px,py-8);ctx.lineTo(px,py+8);ctx.stroke();
 }
 if(!playing){
  ctx.fillStyle='rgba(5,12,24,.65)';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='white';ctx.font='bold 26px Arial';ctx.textAlign='center';
  ctx.fillText(inRoom?'WAITING FOR MATCH':'CREATE OR JOIN A ROOM',w/2,h/2);
 }
}

function loop(now){
 const dt=Math.min(.05,(now-lastFrame)/1000||.016);
 lastFrame=now;move(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
